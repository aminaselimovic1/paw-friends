<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PawFriends API – Swagger</title>
    <!-- Swagger UI 5 from the unpkg CDN (Reading 06) -->
    <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5.17.14/swagger-ui.css">
    <style>body { margin: 0; background: #fafafa; }</style>
</head>
<body>
<div id="swagger-ui"></div>
<script src="https://unpkg.com/swagger-ui-dist@5.17.14/swagger-ui-bundle.js"></script>
<script>
    window.ui = SwaggerUIBundle({
        url: "swagger.php",          // the OpenAPI document, generated from the attributes
        dom_id: "#swagger-ui",
        deepLinking: true,           // an opened endpoint gets its own link in the address bar
        persistAuthorization: true   // keeps the JWT after a page reload (Milestone 4)
    });
</script>
</body>
</html>
