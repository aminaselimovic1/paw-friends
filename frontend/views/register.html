<!-- Register view (guests only). The form is handled in js/auth.js.
     There is no role field: every new account is a user. -->
<section class="py-5">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-10 col-lg-6">
        <div class="form-card">
          <h1 class="h3 text-center mb-4">Create an account</h1>

          <!-- Shown by js/auth.js after a valid form is sent -->
          <div id="registerSuccess" class="alert alert-success d-none" role="status">
            Account created! You can now <a href="#login" class="alert-link">log in</a>.
          </div>

          <!-- novalidate: turns off the browser's own error bubbles,
               so Bootstrap's error messages are shown instead -->
          <form id="registerForm" novalidate>
            <div class="mb-3">
              <label for="registerName" class="form-label">Full name</label>
              <input type="text" class="form-control" id="registerName" name="name"
                     minlength="2" maxlength="100" autocomplete="name" required>
              <div class="invalid-feedback">Enter your full name (2–100 characters).</div>
            </div>

            <div class="mb-3">
              <label for="registerEmail" class="form-label">Email</label>
              <input type="email" class="form-control" id="registerEmail" name="email"
                     autocomplete="email" required>
              <div class="invalid-feedback">Enter a valid email address.</div>
            </div>

            <div class="mb-3">
              <label for="registerPhone" class="form-label">
                Phone <span class="text-body-secondary">(optional)</span>
              </label>
              <!-- pattern: only digits, spaces and + are allowed -->
              <input type="tel" class="form-control" id="registerPhone" name="phone"
                     pattern="[0-9+ ]+" autocomplete="tel">
              <div class="invalid-feedback">Use only digits, spaces and +.</div>
            </div>

            <div class="mb-3">
              <label for="registerPassword" class="form-label">Password</label>
              <div class="input-group has-validation">
                <input type="password" class="form-control" id="registerPassword" name="password"
                       minlength="8" autocomplete="new-password" required>
                <button type="button" class="password-toggle" aria-label="Show password">
                  <i class="bi bi-eye" aria-hidden="true"></i>
                </button>
                <div class="invalid-feedback">Use at least 8 characters.</div>
              </div>
            </div>

            <div class="mb-3">
              <label for="registerConfirmPassword" class="form-label">Confirm password</label>
              <div class="input-group has-validation">
                <input type="password" class="form-control" id="registerConfirmPassword"
                       autocomplete="new-password" required>
                <button type="button" class="password-toggle" aria-label="Show password">
                  <i class="bi bi-eye" aria-hidden="true"></i>
                </button>
                <div class="invalid-feedback">The passwords don't match.</div>
              </div>
            </div>

            <div class="form-check mb-4">
              <input type="checkbox" class="form-check-input" id="registerTerms" required>
              <label for="registerTerms" class="form-check-label">I agree to the terms</label>
              <div class="invalid-feedback">You must agree to the terms.</div>
            </div>

            <button type="submit" class="accent-button w-100">Create account</button>
          </form>

          <p class="text-center mt-4 mb-0">
            Already have an account? <a href="#login" class="text-link">Log in</a>
          </p>
        </div>
      </div>
    </div>
  </div>
</section>
