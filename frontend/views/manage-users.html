<!-- Manage users view (admin): every account, with search, a role filter,
     and add / edit / delete in modals. Milestone 1 uses sample data
     (js/manage-users.js); changes are kept until the page is reloaded. -->

<section class="admin-page py-5">
  <div class="container">
    <!-- ===== Header: back link, title, count and "Add user" ===== -->
    <div class="d-flex flex-wrap justify-content-between align-items-end gap-3 mb-4">
      <div>
        <a href="#admin-dashboard" class="text-link d-inline-block mb-2">
          <i class="bi bi-arrow-left" aria-hidden="true"></i> Admin dashboard
        </a>
        <h1 class="h2 mb-1">Manage users</h1>
        <!-- aria-live: screen readers read the new count when the filters change -->
        <p id="userCount" class="mb-0 text-body-secondary" aria-live="polite"></p>
      </div>
      <button type="button" id="addUserButton" class="accent-button">
        <i class="bi bi-person-plus" aria-hidden="true"></i> Add user
      </button>
    </div>

    <!-- After a save or delete; JS sets the text -->
    <div id="userSaved" class="alert alert-success d-none" role="status"></div>

    <div class="form-card detail-card">
      <!-- The list updates while you type or choose, so there's no submit button -->
      <form id="userFilters" class="row g-3 mb-3" role="search" aria-label="Search and filter users">
        <div class="col-md-8">
          <label for="userSearch" class="form-label">Search by name or email</label>
          <input type="search" id="userSearch" class="form-control" placeholder="e.g. Lejla" autocomplete="off">
        </div>
        <div class="col-md-4">
          <label for="userRoleFilter" class="form-label">Role</label>
          <select id="userRoleFilter" class="form-select">
            <option value="all">All roles</option>
            <option value="user">Users</option>
            <option value="vet">Vets</option>
            <option value="admin">Admins</option>
          </select>
        </div>
      </form>

      <!-- table-responsive: on phones the table scrolls sideways inside this box.
           position-relative keeps the hidden "Actions" label inside it too. -->
      <div id="userTableWrapper" class="table-responsive position-relative">
        <table class="table align-middle mb-0 admin-table">
          <thead>
            <tr>
              <th scope="col">Name</th>
              <th scope="col">Email</th>
              <th scope="col">Role</th>
              <th scope="col"><span class="visually-hidden">Actions</span></th>
            </tr>
          </thead>
          <tbody id="userTableBody"></tbody>
        </table>
      </div>

      <!-- Shown by JS when no user matches -->
      <div id="userEmpty" class="text-center py-4 d-none">
        <p class="mb-3">No users match your search.</p>
        <button type="button" id="userClearFilters" class="outline-button">
          <i class="bi bi-x-circle" aria-hidden="true"></i> Clear filters
        </button>
      </div>
    </div>
  </div>

  <!-- ===== Add / edit a user (one modal for both) =====
       #userId is empty for a new user, or the id of the user being edited. -->
  <div class="modal fade" id="userFormModal" tabindex="-1" aria-labelledby="userFormTitle" aria-hidden="true">
    <div class="modal-dialog">
      <form id="userForm" class="modal-content" novalidate>
        <div class="modal-header">
          <h2 id="userFormTitle" class="modal-title h5"></h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <input type="hidden" id="userId">
          <div class="mb-3">
            <label for="userName" class="form-label">Full name</label>
            <input type="text" class="form-control" id="userName" minlength="2" maxlength="100" required>
            <div class="invalid-feedback">Enter the full name (2–100 characters).</div>
          </div>
          <div class="mb-3">
            <label for="userEmail" class="form-label">Email</label>
            <!-- JS also checks that no other account uses this email -->
            <!-- pattern: the email also needs a dot and an ending like .com (type="email" alone accepts "a@a") -->
            <input type="email" class="form-control" id="userEmail" pattern="[^@\s]+@[^@\s]+\.[a-zA-Z]{2,}" required>
            <div id="userEmailFeedback" class="invalid-feedback">Enter a valid email address, e.g. name@example.com.</div>
          </div>
          <div>
            <label for="userRole" class="form-label">Role</label>
            <select id="userRole" class="form-select">
              <option value="user">User</option>
              <option value="vet">Vet</option>
              <option value="admin">Admin</option>
            </select>
            <!-- Shown when you edit your own account -->
            <div id="userRoleNote" class="form-text d-none">You can't change your own role.</div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="outline-button" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="accent-button">Save</button>
        </div>
      </form>
    </div>
  </div>

  <!-- ===== Delete a user: asks first, or explains why it isn't possible ===== -->
  <div class="modal fade" id="userDeleteModal" tabindex="-1" aria-labelledby="userDeleteTitle" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h2 id="userDeleteTitle" class="modal-title h5"></h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <p id="userDeleteText" class="mb-0"></p>
        </div>
        <div class="modal-footer">
          <button type="button" class="outline-button" data-bs-dismiss="modal">Cancel</button>
          <button type="button" id="confirmDeleteUser" class="btn btn-danger">Delete</button>
        </div>
      </div>
    </div>
  </div>

  <!-- One row of the users table -->
  <template id="userRowTemplate">
    <tr>
      <td>
        <span class="fw-bold user-name"></span>
        <span class="small text-body-secondary user-you d-none">(you)</span>
      </td>
      <td class="user-email"></td>
      <td><span class="badge role-badge user-role"></span></td>
      <td class="text-end text-nowrap">
        <button type="button" class="link-button text-link me-3 edit-user">Edit</button>
        <button type="button" class="link-button text-link delete-user">Delete</button>
      </td>
    </tr>
  </template>
</section>
