<!-- Manage pets view (admin): every pet (also adopted ones), with search,
     filters, and add / edit / delete in modals. Milestone 1 uses sample
     data (js/manage-pets.js); changes are kept until the page is reloaded
     and show up on the Pets pages too. -->

<section class="admin-page py-5">
  <div class="container">
    <!-- ===== Header: back link, title, count and "Add pet" ===== -->
    <div class="d-flex flex-wrap justify-content-between align-items-end gap-3 mb-4">
      <div>
        <a href="#admin-dashboard" class="text-link d-inline-block mb-2">
          <i class="bi bi-arrow-left" aria-hidden="true"></i> Admin dashboard
        </a>
        <h1 class="h2 mb-1">Manage pets</h1>
        <!-- aria-live: screen readers read the new count when the filters change -->
        <p id="managePetCount" class="mb-0 text-body-secondary" aria-live="polite"></p>
      </div>
      <button type="button" id="addPetButton" class="accent-button">
        <i class="bi bi-plus-circle" aria-hidden="true"></i> Add pet
      </button>
    </div>

    <!-- After a save or delete; JS sets the text -->
    <div id="managePetSaved" class="alert alert-success d-none" role="status"></div>

    <div class="form-card detail-card">
      <!-- The list updates while you type or choose, so there's no submit button -->
      <form id="managePetFilters" class="row g-3 mb-3" role="search" aria-label="Search and filter pets">
        <div class="col-lg-4">
          <label for="managePetSearch" class="form-label">Search by name or breed</label>
          <input type="search" id="managePetSearch" class="form-control" placeholder="e.g. Beagle" autocomplete="off">
        </div>
        <div class="col-sm-4 col-lg-2">
          <label for="managePetSpecies" class="form-label">Animal type</label>
          <select id="managePetSpecies" class="form-select">
            <option value="all">All animals</option>
            <option value="dog">Dogs</option>
            <option value="cat">Cats</option>
          </select>
        </div>
        <div class="col-sm-4 col-lg-3">
          <label for="managePetStatus" class="form-label">Status</label>
          <select id="managePetStatus" class="form-select">
            <option value="all">All statuses</option>
            <option value="available">Available</option>
            <option value="pending">Pending</option>
            <option value="adopted">Adopted</option>
          </select>
        </div>
        <div class="col-sm-4 col-lg-3">
          <label for="managePetShelter" class="form-label">Shelter</label>
          <!-- One option per shelter, added by JS -->
          <select id="managePetShelter" class="form-select">
            <option value="all">All shelters</option>
          </select>
        </div>
      </form>

      <!-- table-responsive: on phones the table scrolls sideways inside this box.
           position-relative keeps the hidden "Actions" label inside it too. -->
      <div id="managePetTableWrapper" class="table-responsive position-relative">
        <table class="table align-middle mb-0 admin-table">
          <thead>
            <tr>
              <th scope="col">Pet</th>
              <th scope="col">Species</th>
              <th scope="col">Breed</th>
              <th scope="col">Shelter</th>
              <th scope="col">Born</th>
              <th scope="col">Status</th>
              <th scope="col"><span class="visually-hidden">Actions</span></th>
            </tr>
          </thead>
          <tbody id="managePetTableBody"></tbody>
        </table>
      </div>

      <!-- Shown by JS when no pet matches -->
      <div id="managePetEmpty" class="text-center py-4 d-none">
        <p class="mb-3">No pets match your search.</p>
        <button type="button" id="managePetClear" class="outline-button">
          <i class="bi bi-x-circle" aria-hidden="true"></i> Clear filters
        </button>
      </div>
    </div>
  </div>

  <!-- ===== Add / edit a pet (one modal for both) =====
       #managePetId is empty for a new pet, or the id of the pet being edited.
       Photos can't be uploaded yet: new pets get "Photo coming soon". -->
  <div class="modal fade" id="petFormModal" tabindex="-1" aria-labelledby="petFormTitle" aria-hidden="true">
    <div class="modal-dialog modal-dialog-scrollable">
      <form id="petForm" class="modal-content" novalidate>
        <div class="modal-header">
          <h2 id="petFormTitle" class="modal-title h5"></h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <input type="hidden" id="managePetId">
          <div class="row g-3">
            <div class="col-12">
              <label for="petFormName" class="form-label">Name</label>
              <input type="text" class="form-control" id="petFormName" minlength="2" maxlength="50" required>
              <div class="invalid-feedback">Enter a name (2–50 characters).</div>
            </div>
            <div class="col-sm-6">
              <label for="petFormSpecies" class="form-label">Animal type</label>
              <select id="petFormSpecies" class="form-select">
                <option value="dog">Dog</option>
                <option value="cat">Cat</option>
              </select>
            </div>
            <div class="col-sm-6">
              <label for="petFormBreed" class="form-label">Breed</label>
              <input type="text" class="form-control" id="petFormBreed" maxlength="100" required>
              <div class="invalid-feedback">Enter the breed.</div>
            </div>
            <div class="col-sm-6">
              <label for="petFormSex" class="form-label">Sex</label>
              <select id="petFormSex" class="form-select">
                <option value="male">Male</option>
                <option value="female">Female</option>
              </select>
            </div>
            <div class="col-sm-6">
              <label for="petFormBirthDate" class="form-label">Birth date</label>
              <!-- max (today) is set by JS -->
              <input type="date" class="form-control" id="petFormBirthDate" required>
              <div class="invalid-feedback">Choose the birth date (not in the future).</div>
            </div>
            <div class="col-sm-6">
              <label for="petFormShelter" class="form-label">Shelter</label>
              <!-- One option per shelter, added by JS -->
              <select id="petFormShelter" class="form-select" required>
                <option value="">Choose a shelter</option>
              </select>
              <div class="invalid-feedback">Choose a shelter.</div>
            </div>
            <div class="col-sm-6">
              <label for="petFormStatus" class="form-label">Adoption status</label>
              <select id="petFormStatus" class="form-select">
                <option value="available">Available</option>
                <option value="pending">Pending</option>
                <option value="adopted">Adopted</option>
              </select>
            </div>
            <div class="col-12">
              <label for="petFormDescription" class="form-label">
                Description <span class="text-body-secondary">(optional)</span>
              </label>
              <textarea class="form-control" id="petFormDescription" rows="3" maxlength="500"></textarea>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="outline-button" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="accent-button">Save</button>
        </div>
      </form>
    </div>
  </div>

  <!-- ===== Delete a pet: asks first, or explains why it isn't possible ===== -->
  <div class="modal fade" id="petDeleteModal" tabindex="-1" aria-labelledby="petDeleteTitle" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h2 id="petDeleteTitle" class="modal-title h5"></h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <p id="petDeleteText" class="mb-0"></p>
        </div>
        <div class="modal-footer">
          <button type="button" class="outline-button" data-bs-dismiss="modal">Cancel</button>
          <button type="button" id="confirmDeletePet" class="btn btn-danger">Delete</button>
        </div>
      </div>
    </div>
  </div>

  <!-- One row of the pets table -->
  <template id="managePetRowTemplate">
    <tr>
      <td><a class="text-link managed-pet-name"></a></td>
      <td class="managed-pet-species"></td>
      <td class="managed-pet-breed"></td>
      <td class="managed-pet-shelter"></td>
      <td class="managed-pet-born text-nowrap"></td>
      <td><span class="badge managed-pet-status"></span></td>
      <td class="text-end text-nowrap">
        <button type="button" class="link-button text-link me-3 edit-pet">Edit</button>
        <button type="button" class="link-button text-link delete-pet">Delete</button>
      </td>
    </tr>
  </template>
</section>
