<!-- My applications view (user only).
     The cards are added by js/my-applications.js, using the <template> below. -->
<section class="py-5">
  <div class="container">

    <!-- ===== Header: title, count and status filter ===== -->
    <div class="d-flex flex-wrap justify-content-between align-items-end gap-3 mb-4">
      <div>
        <h1 class="h2 mb-1">My applications</h1>
        <!-- aria-live: screen readers read the new count when the filter changes -->
        <p id="applicationCount" class="mb-0 text-body-secondary" aria-live="polite"></p>
      </div>
      <div>
        <label for="statusFilter" class="form-label">Status</label>
        <select id="statusFilter" class="form-select">
          <option value="all">All</option>
          <option value="pending">Pending</option>
          <option value="approved">Approved</option>
          <option value="rejected">Rejected</option>
        </select>
      </div>
    </div>

    <!-- ===== Application cards (filled in by JS) ===== -->
    <div id="applicationList" class="row g-4"></div>

    <!-- ===== Empty state: shown by JS when no application matches =====
         mt-4: the empty card row above keeps its g-4 negative top margin,
         which would otherwise pull this box up against the header -->
    <div id="emptyState" class="empty-state text-center mt-4 d-none">
      <i class="bi bi-clipboard-heart empty-state-icon" aria-hidden="true"></i>
      <p id="emptyStateText" class="mt-3 mb-4"></p>
      <a href="#pets" class="accent-button">Browse pets</a>
    </div>
  </div>

  <!-- One application card. A <template> is never shown: JS copies it
       for every application and fills in the empty parts. -->
  <template id="applicationCardTemplate">
    <div class="col-lg-6">
      <div class="card application-card h-100">
        <div class="row g-0 h-100">
          <div class="col-sm-4">
            <img class="application-photo" src="" alt="">
          </div>
          <div class="col-sm-8">
            <div class="card-body d-flex flex-column h-100">
              <div class="d-flex justify-content-between align-items-start gap-2 mb-2">
                <h2 class="h5 mb-0 application-pet-name"></h2>
                <span class="badge application-status"></span>
              </div>
              <p class="mb-1"><strong>Applied:</strong> <span class="application-date"></span></p>
              <p class="mb-3"><strong>Shelter:</strong> <span class="application-shelter"></span></p>
              <a class="accent-button mt-auto align-self-start application-details-link"
                 href="#pet-details">View details</a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </template>
</section>
