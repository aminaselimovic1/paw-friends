<!-- Manage applications view (admin): every adoption application, with
     search and a status filter. "Review" opens a modal where the admin
     approves or rejects a pending application. Milestone 1 uses sample data
     (js/manage-applications.js); decisions are kept until the page is reloaded.
     The admin dashboard links here with #manage-applications?review=4, which
     opens the review of application 4 straight away. -->

<section class="admin-page py-5">
  <div class="container">
    <!-- ===== Header: back link, title and count ===== -->
    <div class="mb-4">
      <a href="#admin-dashboard" class="text-link d-inline-block mb-2">
        <i class="bi bi-arrow-left" aria-hidden="true"></i> Admin dashboard
      </a>
      <h1 class="h2 mb-1">Adoption applications</h1>
      <!-- aria-live: screen readers read the new count when the filters change -->
      <p id="manageApplicationCount" class="mb-0 text-body-secondary" aria-live="polite"></p>
    </div>

    <!-- After an approval or rejection; JS sets the text -->
    <div id="applicationDecision" class="alert alert-success d-none" role="status"></div>

    <div class="form-card detail-card">
      <!-- The list updates while you type or choose, so there's no submit button -->
      <form id="manageApplicationFilters" class="row g-3 mb-3" role="search" aria-label="Search and filter applications">
        <div class="col-md-8">
          <label for="manageApplicationSearch" class="form-label">Search by applicant or pet</label>
          <input type="search" id="manageApplicationSearch" class="form-control" placeholder="e.g. Luna" autocomplete="off">
        </div>
        <!-- "selected": the admin first sees the applications waiting for a decision -->
        <div class="col-md-4">
          <label for="manageApplicationStatus" class="form-label">Status</label>
          <select id="manageApplicationStatus" class="form-select">
            <option value="pending" selected>Waiting for review</option>
            <option value="approved">Approved</option>
            <option value="rejected">Rejected</option>
            <option value="all">All statuses</option>
          </select>
        </div>
      </form>

      <!-- table-responsive: on phones the table scrolls sideways inside this box.
           position-relative keeps the hidden "Actions" label inside it too. -->
      <div id="manageApplicationTableWrapper" class="table-responsive position-relative">
        <table class="table align-middle mb-0 admin-table">
          <thead>
            <tr>
              <th scope="col">Applicant</th>
              <th scope="col">Pet</th>
              <th scope="col">Shelter</th>
              <th scope="col">Applied</th>
              <th scope="col">Status</th>
              <th scope="col"><span class="visually-hidden">Actions</span></th>
            </tr>
          </thead>
          <tbody id="manageApplicationTableBody"></tbody>
        </table>
      </div>

      <!-- Shown by JS when no application matches -->
      <div id="manageApplicationEmpty" class="text-center py-4 d-none">
        <p class="mb-3">No applications match your search.</p>
        <button type="button" id="manageApplicationClear" class="outline-button">
          <i class="bi bi-x-circle" aria-hidden="true"></i> Clear filters
        </button>
      </div>
    </div>
  </div>

  <!-- ===== Review one application =====
       JS fills in the details. Approve and Reject are shown only while the
       application is pending; a decided one shows who reviewed it. -->
  <div class="modal fade" id="reviewModal" tabindex="-1" aria-labelledby="reviewTitle" aria-hidden="true">
    <div class="modal-dialog modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header">
          <h2 id="reviewTitle" class="modal-title h5"></h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <dl class="row mb-0">
            <dt class="col-sm-4">Applicant</dt>
            <dd id="reviewApplicant" class="col-sm-8"></dd>
            <dt class="col-sm-4">Email</dt>
            <dd id="reviewEmail" class="col-sm-8"></dd>
            <dt class="col-sm-4">Pet</dt>
            <dd class="col-sm-8"><a id="reviewPet" class="text-link"></a></dd>
            <dt class="col-sm-4">Shelter</dt>
            <dd id="reviewShelter" class="col-sm-8"></dd>
            <dt class="col-sm-4">Applied</dt>
            <dd id="reviewDate" class="col-sm-8"></dd>
            <dt class="col-sm-4">Status</dt>
            <dd class="col-sm-8"><span id="reviewStatus" class="badge"></span></dd>
            <dt class="col-sm-4 review-reviewer">Reviewed by</dt>
            <dd id="reviewReviewer" class="col-sm-8 review-reviewer"></dd>
            <dt class="col-sm-4">Message</dt>
            <dd id="reviewMessage" class="col-sm-8 mb-0"></dd>
          </dl>
          <!-- Pending only: what approving will do -->
          <p id="reviewNote" class="alert alert-info mt-3 mb-0"></p>
        </div>
        <div class="modal-footer">
          <button type="button" class="outline-button" data-bs-dismiss="modal">Close</button>
          <button type="button" id="rejectApplication" class="btn btn-danger review-action">Reject</button>
          <button type="button" id="approveApplication" class="accent-button review-action">Approve</button>
        </div>
      </div>
    </div>
  </div>

  <!-- One row of the applications table -->
  <template id="manageApplicationRowTemplate">
    <tr>
      <td>
        <span class="fw-bold application-applicant"></span>
        <span class="d-block small text-body-secondary application-email"></span>
      </td>
      <td><a class="text-link application-pet"></a></td>
      <td class="application-shelter"></td>
      <td class="application-date"></td>
      <td><span class="badge application-status"></span></td>
      <td class="text-end">
        <button type="button" class="link-button text-link review-application">Review</button>
      </td>
    </tr>
  </template>
</section>
